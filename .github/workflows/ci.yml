name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        run: python -m pytest -q

  plugin-check:
    name: 插件结构自检（metadata / schema / 语法）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验每个插件的元数据、可视化配置与语法
        run: |
          python - <<'PY'
          import json
          import py_compile
          import sys
          from pathlib import Path

          root = Path("plugins")
          errors = []

          for plugin in sorted(p for p in root.iterdir() if p.is_dir()):
              name = plugin.name
              for fname in ("main.py", "metadata.yaml", "_conf_schema.json"):
                  if not (plugin / fname).is_file():
                      errors.append(f"{name}: 缺少 {fname}")

              try:
                  py_compile.compile(str(plugin / "main.py"), doraise=True)
              except Exception as exc:  # noqa: BLE001
                  errors.append(f"{name}: main.py 语法错误 {exc}")

              schema_path = plugin / "_conf_schema.json"
              if schema_path.is_file():
                  try:
                      json.loads(schema_path.read_text(encoding="utf-8"))
                  except Exception as exc:  # noqa: BLE001
                      errors.append(f"{name}: _conf_schema.json 不是合法 JSON：{exc}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("全部插件结构检查通过")
          PY
